name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example, v0.0.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve existing release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" != v* || "$RELEASE_TAG" == */* ]] || ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo '::error::Release tag must be a valid single-component tag starting with v.'
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          commit=$(git rev-parse 'FETCH_HEAD^{commit}')
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: blacksmith-6vcpu-macos-15
          - target: x86_64-apple-darwin
            runner: blacksmith-6vcpu-macos-15
          - target: x86_64-unknown-linux-gnu
            runner: blacksmith-4vcpu-ubuntu-2404
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Install stable Rust with target
        run: |
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/figmog

      - name: Package tarball
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          tar czf "figmog-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" \
            -C target/${{ matrix.target }}/release figmog

      - uses: actions/upload-artifact@v6
        with:
          name: figmog-${{ matrix.target }}
          path: "figmog-${{ needs.resolve.outputs.tag }}-${{ matrix.target }}.tar.gz"
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub release (pre-release)
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --prerelease \
            --title "$RELEASE_TAG" \
            --notes "Pre-release binaries for testing. See the README's Install section for platform tarballs, the SHA256SUMS verification snippet, and the macOS quarantine note. figmog depends on fold via a pinned git rev; upstream bogkit currently ships with no license file, so broader redistribution beyond this repo's own testing releases is deferred until that clears (see README's License section)." \
            *.tar.gz SHA256SUMS
