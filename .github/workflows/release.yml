name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust with target
        run: |
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/figmog

      - name: Package tarball
        run: |
          tar czf figmog-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release figmog

      - uses: actions/upload-artifact@v4
        with:
          name: figmog-${{ matrix.target }}
          path: figmog-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub release (pre-release)
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes "Pre-release binaries for testing. See the README's Install section for platform tarballs, checksum verification, and the macOS quarantine note. figmog depends on fold via a pinned git rev; upstream bogkit currently ships with no license file, so broader redistribution beyond this repo's own testing releases is deferred until that clears (see README's License section)." \
            *.tar.gz SHA256SUMS
